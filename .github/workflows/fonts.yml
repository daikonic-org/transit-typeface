name: Fonts

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install dependencies
        run: python -m pip install -r requirements.lock
      - name: Rebuild and verify approved fonts
        run: python tools/pipeline.py approved
      - name: Verify weighting interpolation and retained designs
        run: python tools/check_weighting.py all --production
      - name: Verify selected Code preview
        run: python tools/package_code_preview.py --check
