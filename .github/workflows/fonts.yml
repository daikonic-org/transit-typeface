name: Fonts

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install dependencies
        run: python -m pip install -r requirements.lock
      - name: Rebuild and verify approved fonts
        run: python tools/pipeline.py approved
      - name: Verify weighting interpolation and retained designs
        run: python tools/check_weighting.py all --production
      - name: Verify selected Code preview
        run: python tools/package_code_preview.py --check
      - name: Verify dot palette, syntax and numeral studies
        run: |
          python tools/check_dot_palette.py
          python tools/check_syntax_numerals.py
      - name: Verify Rust lifetime apostrophe and protected literals
        run: python tools/check_rust_lifetimes.py
      - name: Verify contextual pipe delimiters
        run: python tools/code_bar_proof.py --check --font previews/code-1.032/VF/DaikonicTransitCode-VF.ttf
      - name: Verify selected joined Logic enclosures
        run: python tools/code_enclosure_ligatures.py
      - name: Verify font-rendered README feature tables
        run: python tools/readme_features.py --check
      - name: Verify positioning and optical-size candidates
        run: python tools/check_layout_optical.py
      - name: Verify CFF OpenType exports
        run: python tools/check_otf_exports.py
      - name: Verify specimen sources and exports
        run: python tools/specimen_release.py --check
