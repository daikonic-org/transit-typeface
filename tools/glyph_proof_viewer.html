<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>$title</title>
<style>
:root { color-scheme: light; font: 15px/1.45 system-ui, sans-serif; color: #252d29; background: #f0efe9; }
body { margin: 0; }
header { padding: 0.9rem clamp(1rem, 4vw, 3rem); background: white; border-bottom: 1px solid #d6d8cf; }
h1 { margin: 0 0 0.7rem; font-size: 1.35rem; }
nav, .control { display: flex; align-items: center; flex-wrap: wrap; gap: 0.45rem; }
nav, #glyph-navigation { gap: 0.65rem 1rem; }
.page-control { flex-wrap: nowrap; max-width: 100%; }
#page { min-width: 0; }
button, select, textarea, input[type="number"] { font: inherit; border: 1px solid #a4aba3; border-radius: 0.25rem; padding: 0.35rem 0.55rem; background: white; color: inherit; }
input[type="number"] { width: 5.2rem; }
.axis-controls { margin-top: 0.7rem; gap: 0.65rem 1rem; }
.axis-controls > .control { gap: 0.45rem; }
button:disabled { opacity: 0.5; }
a { color: #235749; }
main { padding: 1rem; overflow-x: auto; }
.sheet { display: block; width: min(100%, ${width}px); max-width: none; height: auto; margin: 0 auto; box-shadow: 0 1px 6px #0002; }
#type-proof { max-width: ${width}px; margin: 0 auto; }
.text-controls, .sample-group { padding: 1rem; background: white; border: 1px solid #d6d8cf; border-radius: 0.35rem; }
.text-controls { display: grid; gap: 0.65rem; }
#sample-text { box-sizing: border-box; width: 100%; resize: vertical; }
#text-samples { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 300px), 1fr)); gap: 0.75rem; margin-top: 0.75rem; }
.sample-group { min-width: 0; }
.sample-group h2 { font-size: 1rem; margin: 0 0 0.6rem; }
.text-sample { border-top: 1px solid #e1e3db; padding: 0.5rem 0; }
.text-sample-label { display: block; color: #435451; font-size: 0.85rem; }
.text-sample-value { margin: 0.1em 0; font-family: TransitProof, sans-serif; font-size: var(--sample-size, 42px); line-height: 1.3; font-optical-sizing: none; font-kerning: normal; font-synthesis: none; white-space: pre-wrap; overflow-wrap: anywhere; }
[hidden] { display: none !important; }
</style>
$site_style
<body$site_class>
<header>
$site_navigation
  <h1>$title</h1>
  <nav aria-label="Glyph proof">
$site_controls
    <div class="control" id="mode-control" hidden>
      <label for="proof-mode">View</label>
      <select id="proof-mode">
        <option value="glyphs">Glyphs</option>
        <option value="text">Type sample</option>
      </select>
    </div>
    <div class="control" id="glyph-navigation">
      <div class="control page-control">
        <button type="button" id="previous" aria-label="Previous page">←</button>
        <label for="page">Page</label>
        <select id="page">$options</select>
        <button type="button" id="next" aria-label="Next page">→</button>
      </div>
      <div class="control" id="glyph-controls" hidden>
        <label for="glyph">Glyph</label>
        <select id="glyph"></select>
        <button type="button" id="back-to-page" hidden>Back to page</button>
      </div>
      <div class="control">
        <label for="zoom">Zoom</label>
        <select id="zoom">
          <option value="">Fit</option>
          <option value="1">100%</option>
          <option value="1.5">150%</option>
          <option value="2">200%</option>
        </select>
      </div>
    </div>
$downloads
  </nav>
$site_status
  <div id="axis-controls" class="control axis-controls" aria-label="Variation axes" hidden></div>
  <div id="axis-status" role="status"></div>
</header>
<main>
  <img class="sheet" id="proof" src="$initial_page" width="$width" height="$height"
       alt="$initial_label" title="Double-click a glyph row to inspect it">
  <svg class="sheet" id="glyph-detail" role="img" hidden>
    <svg class="detail-window" height="$detail_header" overflow="hidden"><image width="$width" height="$height"/></svg>
    <svg class="detail-window" y="$detail_header" overflow="hidden"><image width="$width" height="$height"/></svg>
  </svg>
  <svg class="sheet" id="live-proof" role="img" font-family="Arial,sans-serif" hidden></svg>
  <section id="type-proof" aria-label="Type sample" hidden>
    <div class="text-controls">
      <label for="sample-text">Sample text</label>
      <textarea id="sample-text" rows="2" spellcheck="false" dir="auto">Legend</textarea>
      <div class="control">
        <label for="sample-size">Size (px)</label>
        <input id="sample-size" type="number" min="8" max="144" value="42">
        <label><input id="all-presets" type="checkbox"> Show all presets</label>
      </div>
    </div>
    <div id="text-samples"></div>
  </section>
</main>
$site_footer
<script type="application/json" id="glyph-rows">$rows</script>
<script type="application/json" id="axis-comparison">$comparison</script>
<script>
$compare_script
const pages = document.querySelector("#page");
const zoom = document.querySelector("#zoom");
const preview = document.querySelector("#proof");
const previous = document.querySelector("#previous");
const next = document.querySelector("#next");
const glyphControls = document.querySelector("#glyph-controls");
const glyphPicker = document.querySelector("#glyph");
const backToPage = document.querySelector("#back-to-page");
const detail = document.querySelector("#glyph-detail");
const windows = detail.querySelectorAll(".detail-window");
let rows = JSON.parse(document.querySelector("#glyph-rows").textContent);
let prefix = $prefix;
const live = document.querySelector("#live-proof");
const proofMode = document.querySelector("#proof-mode");
const typeProof = document.querySelector("#type-proof");
const glyphNavigation = document.querySelector("#glyph-navigation");
const comparisonData = JSON.parse(document.querySelector("#axis-comparison").textContent);
let comparison;
const params = new URLSearchParams(location.search);
document.querySelector("#all-presets").checked = params.get("presets") === "all";
if (params.get("view") === "text") proofMode.value = "text";
setComparison(comparisonData);

function setComparison(data) {
  comparison?.dispose();
  comparison = data && createAxisComparison(data, live, renderSelection);
  document.querySelector("#mode-control").hidden = !comparison;
}

function activateProof(data) {
  const pageName = pages.value;
  const glyphName = rows[pageName]?.[glyphPicker.value]?.name;
  rows = data.rows;
  prefix = data.prefix;
  pages.replaceChildren(...data.pages.map(([name, title], index) => {
    const option = new Option((index + 1) + ". " + title, name);
    option.dataset.title = title;
    return option;
  }));
  if (rows[pageName]) pages.value = pageName;
  setComparison(data.comparison);
  showPage();
  const glyphIndex = rows[pages.value].findIndex(row => row.name === glyphName);
  if (glyphIndex !== -1) {
    glyphPicker.value = glyphIndex;
    renderSelection();
  }
}

function resize() {
  const sheet = [live, detail, preview].find(item => !item.hasAttribute("hidden"));
  if (sheet) sheet.style.width = zoom.value ? sheet.getAttribute("width") * Number(zoom.value) + "px" : "";
}

function renderSelection() {
  const typing = comparison && proofMode.value === "text";
  typeProof.hidden = !typing;
  glyphNavigation.hidden = Boolean(typing);
  comparison?.setTextMode(typing);
  if (typing) {
    preview.hidden = detail.hidden = live.hidden = true;
    return;
  }
  const page = pages.selectedOptions[0];
  const source = prefix + page.value;
  const row = rows[page.value]?.[glyphPicker.value];
  const showComparison = comparison?.active() ?? false;
  live.toggleAttribute("hidden", !showComparison);
  if (showComparison) {
    comparison.render(page.dataset.title, rows[page.value] || [], row);
  } else if (row) {
    const [x, y, w, h] = row.box;
    detail.setAttribute("aria-label", row.label + " across weights");
    detail.setAttribute("viewBox", [0, 0, w, h + $detail_header].join(" "));
    detail.setAttribute("width", w);
    detail.setAttribute("height", h + $detail_header);
    windows[0].setAttribute("viewBox", [x, $header_y, w, $detail_header].join(" "));
    windows[1].setAttribute("viewBox", row.box.join(" "));
    windows[1].setAttribute("height", h);
    for (const pane of windows) {
      pane.setAttribute("width", w);
      pane.querySelector("image").setAttribute("href", source);
    }
  } else {
    preview.src = source;
    preview.alt = page.text;
  }
  preview.hidden = Boolean(row) || showComparison;
  backToPage.hidden = !row;
  detail.toggleAttribute("hidden", !row || showComparison);
  resize();
}

function showPage() {
  const page = pages.selectedOptions[0];
  const items = rows[page.value] || [];
  glyphPicker.replaceChildren(new Option("All glyphs", ""));
  items.forEach((item, index) => glyphPicker.add(new Option(item.label, index)));
  glyphControls.hidden = items.length === 0;
  previous.disabled = pages.selectedIndex === 0;
  next.disabled = pages.selectedIndex === pages.length - 1;
  renderSelection();
}

pages.addEventListener("change", showPage);
proofMode.addEventListener("change", renderSelection);
zoom.addEventListener("change", resize);
glyphPicker.addEventListener("change", renderSelection);
function inspectGlyph(event) {
  if (glyphPicker.value !== "") return;
  const sheet = event.currentTarget;
  const image = sheet.getBoundingClientRect();
  const x = (event.clientX - image.left) * Number(sheet.getAttribute("width")) / image.width;
  const y = (event.clientY - image.top) * Number(sheet.getAttribute("height")) / image.height;
  const index = (rows[pages.value] || []).findIndex(({box: [left, top, w, h]}) =>
    left <= x && x < left + w && top <= y && y < top + h
  );
  if (index >= 0) {
    glyphPicker.value = index;
    renderSelection();
  }
}
preview.addEventListener("dblclick", inspectGlyph);
live.addEventListener("dblclick", inspectGlyph);
function returnToPage() {
  glyphPicker.value = "";
  renderSelection();
  glyphPicker.focus();
}
backToPage.addEventListener("click", returnToPage);
document.addEventListener("keydown", (event) => {
  if (event.key === "Escape" && proofMode.value === "glyphs" && glyphPicker.value !== "") returnToPage();
});
previous.addEventListener("click", () => {
  pages.selectedIndex -= 1;
  showPage();
});
next.addEventListener("click", () => {
  pages.selectedIndex += 1;
  showPage();
});
showPage();
</script>
$site_script
</body>
</html>
